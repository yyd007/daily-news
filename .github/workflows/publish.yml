name: Publish daily news

on:
  # Asia/Shanghai 09:08 / 09:38 and 19:08 / 19:38.
  # A second slot is the backup if GitHub drops the first hourly cron.
  schedule:
    - cron: "8 1 * * *"
    - cron: "38 1 * * *"
    - cron: "8 11 * * *"
    - cron: "38 11 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate briefing
        if: github.event_name != 'push'
        run: python generate_news.py
      - name: Keep today's morning briefing for the 7pm update
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/briefing.json site/index.html
          git diff --cached --quiet || git commit -m "Update daily news website."
          git pull --rebase origin main
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
